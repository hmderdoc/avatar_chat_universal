; futurewave.ini -- the default avatar_chat_universal theme.
;
; Color values are pipe-separated CGA names. Foreground tokens:
;   black blue green cyan red magenta brown lightgray
;   darkgray lightblue lightgreen lightcyan lightred lightmagenta yellow white
; Background tokens (always combined with a foreground via "|"):
;   bgblack bgblue bggreen bgcyan bgred bgmagenta bgbrown bglightgray
;
; Every key is optional. Anything you don't set falls back to the built-in
; defaults shown below. Copy this file to themes/<yourname>.ini, edit, and
; point avatar_chat.ini's `theme = <yourname>` at it.

name = futurewave

; Header bar (MOTD strip across the top of the screen).
header_stats = black|bggreen
header_motd  = white|bggreen

; Top action bar -- the row of "/who /img /channels ..." pills.
top_action_bar       = white|bgblue
top_action_pill      = lightcyan|bgmagenta
top_action_highlight = white|bgred

; Bottom action bar -- the second row of pills (history, /join, /me, etc.)
bottom_action_bar       = white|bgmagenta
bottom_action_pill      = black|bgcyan
bottom_action_highlight = white|bgred

; Input line (where you type).
input_prompt = yellow
input_text   = lightgreen
input_cursor = lightgray|bglightgray

; Chat bubbles.
bubble_left    = black|bgcyan
bubble_self    = white|bgblue
bubble_private = white|bgred

; Bubble header line (speaker, timestamp, BBS host).
speaker_left = lightmagenta
speaker_self = lightcyan
timestamp    = lightblue
host         = magenta

; Notice rendering ("* Last msg ...", "* Users in main: ..." etc).
notice_default = darkgray

; Modal frames (roster, image viewer, avatar selector chrome).
modal_bg    = lightgray|bgblack
modal_title = yellow|bgblue

; TV lounge caption bar -- the live-subtitle strip across the bottom row
; while a channel is tuned to a telnetvision feed. Keep it high-contrast so
; subtitles read over the video chrome.
tv_caption  = white|bgblue

; ---------------------------------------------------------------------------
; SCREENSAVER PROFILE (optional)
; ---------------------------------------------------------------------------
; A theme can ship its own idle-animation set. Anything left blank inherits
; the main avatar_chat.ini values, so themes only need to override what they
; want to change.
;
; idle_random   true|false -- pick next animation randomly vs follow sequence
; idle_sequence comma-separated names, played in order when idle_random=false
; idle_disable  comma-separated names to skip entirely
;
; Available animation names:
;   starfield, matrix_rain, life, plasma, aurora, fireworks, lightning,
;   snowfall, raindrops, perlin, terrain, kaleidoscope, blobs, orbit, bouncy,
;   avatars_float, figlet_message
;
;idle_random   = true
;idle_sequence = avatars_float, figlet_message
;idle_disable  = lightning, fireworks
