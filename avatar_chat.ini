; avatar_chat_universal — door config
; This mirrors the Synchronet JS door's avatar_chat.ini schema so the two doors
; can share configuration concepts. P0 only consumes a subset; later phases
; will read more keys (idle animations, figlet, etc).

; ---------------------------------------------------------------------------
; CHAT SERVER
; ---------------------------------------------------------------------------
host = futureland.today
port = 10088
default_channel = main
max_history = 200
poll_delay_ms = 25
reconnect_delay_ms = 3000
input_max_length = 500

; ---------------------------------------------------------------------------
; BBS IDENTITY (used to namespace per-user avatar persistence)
; ---------------------------------------------------------------------------
; If unset, falls back to drop-file BBSID + sysop name. Set this to a stable
; short slug so users keep the same avatar across BBS renames.
bbs_id = futureland.today
;sysop  = chairmanmow

; Directory of additional .bin avatar collections you (the sysop) curate. The
; door scans this on launch and offers them alongside the bundled collections
; in the avatar selector. Default: ./avatars/sysop relative to the door's cwd.
;sysop_avatars_dir = ./avatars/sysop

; ---------------------------------------------------------------------------
; OUTPUT CHARSET
; ---------------------------------------------------------------------------
; cp437  - send raw 8-bit CP437 bytes. Correct for SyncTERM, NetRunner,
;          mtelnet, fTelnet, and any classic BBS client. This is the default.
; utf8   - translate every cell byte through the CP437→Unicode table and emit
;          UTF-8. Use this when users connect via xterm / Terminal.app /
;          iTerm / kitty / Windows Terminal — i.e. anything that defaults to
;          UTF-8 and treats raw 0x80-0xFF bytes as broken UTF-8 sequences.
output_charset = cp437

; ---------------------------------------------------------------------------
; IDLE ANIMATIONS
; ---------------------------------------------------------------------------
; When the user is idle (no keypress) for idle_timeout_seconds, the chat
; transcript area swaps for a background animation. Any keypress or new
; message brings the chat back. Animations rotate every idle_switch_interval
; seconds; at idle_fps frames per second.
;
; Available background animations (paint behind chat; fill the gutter):
;   tv_static, matrix_rain, life, starfield, fireflies, sine_wave,
;   comet_trails, plasma, fireworks, aurora, fire_smoke, ocean_ripple,
;   lissajous, lightning, tunnel
; Available foreground animations (overlay chat; sprite-level transparency):
;   avatars_float, figlet_message

idle_enabled = true
idle_timeout_seconds = 15
idle_switch_interval = 15
idle_fps = 8

; true = pick next animation randomly; false = follow idle_sequence (or
; registration order if idle_sequence is unset).
idle_random = false

; Optional explicit playback order (comma-separated). Names not in this
; list still play if they're not in idle_disable.
;idle_sequence = starfield, aurora, plasma, matrix_rain, life

; Comma-separated list of animation names to skip entirely. Useful when
; one or two effects don't render well on your terminal or you want a
; calmer idle background.
;idle_disable = fireworks, lightning

; ---------------------------------------------------------------------------
; FIGLET MESSAGE settings (foreground animation)
; ---------------------------------------------------------------------------
; Pipe-separated messages, picked at random when the figlet_message
; animation runs. Default: "Avatar Chat".
idle_figlet_messages = Avatar Chat
; Cycle through colors per character?
idle_figlet_colors = true
; Bounce the message around (vs static centered)?
idle_figlet_move = true

; ---------------------------------------------------------------------------
; THEME
; ---------------------------------------------------------------------------
; Color palette and (optional) screensaver profile. Set this to a theme
; name (e.g. "forest") and the door will load themes/forest.ini at startup.
; Anything the theme doesn't override stays at the defaults shipped here.
; Use the bundled themes/futurewave.ini as a template for your own.
theme = futurewave

; ---------------------------------------------------------------------------
; SPLASH SCREEN
; ---------------------------------------------------------------------------
; Bundled ANSI splash is embedded in the binary. Auto-dismiss after this
; many seconds (any keypress also dismisses). Set to 0 to skip the splash
; entirely.
splash_timeout_seconds = 5

; ---------------------------------------------------------------------------
; ANSI GALLERY (idle screensaver)
; ---------------------------------------------------------------------------
; Drop SAUCE-tagged .ans / .bin artwork into this directory (subdirectories
; are walked recursively, organize however you like) and the "ansi_gallery"
; idle animation will scroll through them while users idle. Wider art
; (132 / 160 cols) is clipped at the right edge without distorting
; alignment; narrower art is centered horizontally. Empty / missing dir
; disables the animation. Rotate with the other idle animations via
; idle_sequence (or leave the sequence unset and it joins the random pool).
ansi_gallery_dir = ../../text/16Colors/sixteencolors-archive-master

; If true, slot a single piece of gallery art between every procedural idle
; animation, so the rotation looks like proc -> art -> proc -> art -> ...
; Mirrors the JS future_shell screensaver behavior. Quietly disabled when
; ansi_gallery_dir is empty / has no .ans/.bin files.
idle_interleave_ansi = true

; ---------------------------------------------------------------------------
; TV LOUNGE (telnetvision)
; ---------------------------------------------------------------------------
; When a channel is "tuned" to a telnetvision feed (/tvtuner <host> <port>
; <channel>), the chat area becomes a shared video screen: the feed fills the
; background, a command-hint strip sits across the top, incoming chat pops up
; just above a live caption bar, and PgUp pulls recent history over the video.

; Starting color depth for the video. "truecolor" (24-bit) looks best in
; SyncTERM and other modern clients; "16" falls back to the CGA palette for
; thin pipes or older terminals. Truecolor support can't be detected reliably
; over a BBS connection, so users flip it live with /tvcolor or Ctrl-T.
tv_color = truecolor

; How long an incoming chat line lingers as a popup over the video, in seconds
; (clamped to 5-15). Lower = less obtrusive; higher = easier to follow chat.
tv_popup_seconds = 10

; Show sender avatars in the chat popups? Off by default — the video already
; competes for the screen, so plain "nick: text" lines read more cleanly.
tv_avatars = false

; The caption bar's color is a THEME key, not set here. Override it in your
; themes/<name>.ini with e.g.  tv_caption = black|bgcyan  (default white|bgblue).