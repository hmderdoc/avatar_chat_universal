# Builds avatar_chat_universal, avatar_chat_server, and bridge binaries for
# every supported platform whenever a version tag (vX.Y.Z) is pushed, and
# uploads the resulting tarballs to the GitHub Release page for that tag.
#
# Sysops grab the one matching their platform from the Releases tab.
# Source-only consumers (anyone with Go installed) can ignore this and
# `make build` themselves.

name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: '386' }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: '386' }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: |
          # Delegate to the Makefile so `make dist-<plat>` produces
          # exactly what a local sysop would get -- the GHA workflow
          # and `make dist` cannot drift apart.
          make dist-${{ matrix.goos }}_${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/avatar_chat_universal_*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/avatar_chat_universal_*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
