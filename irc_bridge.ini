; Avatar Chat <-> IRC bridge configuration.
;
; Run with:
;   ./avatar_chat_irc_bridge -config irc_bridge.ini

[irc]
host = futureland.today
port = 6667
tls = false
nick = avatarbridge
username = avatarbridge
realname = Avatar Chat
channel = #avatarchat
; password =
; nickserv_password =

[chat]
host = futureland.today
port = 10088
nick = IRC
system = IRC Bridge
channel = main

[bridge]
irc_to_chat = true
chat_to_irc = true
strip_irc_formatting = true
; BITMAP payloads cannot be rendered by IRC clients.
; filter   = drop them
; announce = send a short "[image omitted]" line
; dump     = forward the raw [BITMAP|...] envelope
bitmap_mode = announce
reconnect_delay_seconds = 5
