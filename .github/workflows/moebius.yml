# Builds the vendored Moebius editor (moebius_chat/, with the Avatar Chat
# integration) for the three modern desktop targets, each on its native runner:
#
#   macOS   -> Moebius.dmg            (universal: x64 + arm64)
#   Windows -> Moebius.Setup.exe      (NSIS installer, x64) + Moebius.exe (portable)
#   Linux   -> Moebius.AppImage       (x64)
#
# Each platform uploads its OWN workflow artifact (Moebius-macOS / -Windows /
# -Linux), so you can download just the one you want instead of the whole set.
# On a published Release (tags via release.yml) the raw installers are also
# attached as release assets for direct, no-zip downloads.
#
# Builds are unsigned (no certs in CI). First launch:
#   macOS:   xattr -dr com.apple.quarantine /Applications/Moebius.app
#   Windows: SmartScreen -> More info -> Run anyway
# Add CSC_* / APPLE_* secrets later for signed/notarized output.

name: moebius

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'moebius_chat/**'
      - '.github/workflows/moebius.yml'
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            build: npx electron-builder --mac --publish never
            glob: dist/*.dmg
          - os: windows-latest
            platform: Windows
            build: npx electron-builder --win nsis portable --x64 --publish never
            glob: dist/*.exe
          - os: ubuntu-latest
            platform: Linux
            build: npx electron-builder --linux AppImage --x64 --publish never
            glob: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: moebius_chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build ${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no signing identity in CI (macOS)
        run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: Moebius-${{ matrix.platform }}
          path: moebius_chat/${{ matrix.glob }}
          if-no-files-found: error

  # On a published release, attach the raw installers as release assets so they
  # can be downloaded individually (no artifact zip).
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
