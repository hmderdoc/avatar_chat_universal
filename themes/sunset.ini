; sunset.ini -- reds, magentas and browns.
;
; Color values are pipe-separated CGA names. Foreground tokens:
;   black blue green cyan red magenta brown lightgray
;   darkgray lightblue lightgreen lightcyan lightred lightmagenta yellow white
; Background tokens (always combined with a foreground via "|"):
;   bgblack bgblue bggreen bgcyan bgred bgmagenta bgbrown bglightgray
;
; Every key is optional; anything unset falls back to the built-in
; futurewave colours. Users pick a theme with /theme (or in /settings)
; unless avatar_chat.ini sets user_themes = off. See THEMING.md.

name = sunset


; Header bar (MOTD strip across the top of the screen).
header_stats = yellow|bgred
header_motd  = white|bgred

; Top action bar -- the row of "/who /img /channels ..." pills.
top_action_bar       = white|bgmagenta
top_action_pill      = yellow|bgred
top_action_highlight = black|bglightgray

; Bottom action bar -- the second row of pills.
bottom_action_bar       = white|bgred
bottom_action_pill      = black|bgbrown
bottom_action_highlight = black|bglightgray

; Input line (where you type); input_bg fills the rest of the row.
input_prompt = lightred
input_text   = yellow
input_cursor = brown|bgbrown
input_bg     = lightgray|bgblack

; Chat bubbles. A mention is someone else's line that says your name;
; mention_edge is the bar down its left side (foreground only).
bubble_left    = white|bgmagenta
bubble_self    = black|bgbrown
bubble_private = white|bgred
bubble_mention = black|bglightgray
mention_edge   = yellow

; Link-preview cards: foregrounds only, drawn on the bubble's background,
; so pick colours that read on every bubble colour above.
card_site  = lightgray
card_title = white
card_edge  = yellow

; Bubble header line (speaker, timestamp, BBS host).
speaker_left = lightmagenta
speaker_self = yellow
timestamp    = lightred
host         = magenta

; Notices ("* Last msg ...", "* Users in main: ...").
notice_default = brown

; Pickers and panels: /who, /channels, /settings, and the /img viewer bars.
modal_bg     = lightgray|bgblack
modal_title  = yellow|bgred
modal_close  = white|bgred
modal_text   = white|bgblack
modal_label  = lightred|bgblack
modal_select = black|bgbrown
modal_hint   = yellow|bgblack
modal_unread = lightmagenta|bgblack
modal_rule   = red|bgblack
modal_ok     = yellow|bgblack
viewer_bar   = yellow|bgred

; Dialog boxes drawn over the chat (the avatar upload instructions).
dialog_bg    = white|bgmagenta
dialog_title = yellow|bgred
dialog_head  = yellow|bgmagenta
dialog_hint  = black|bgmagenta
dialog_ok    = white|bgmagenta

; NSFW veil: two shades of noise plus the "/nsfw to show" label.
veil_dark  = red|bgblack
veil_light = magenta|bgblack
veil_label = yellow|bgred

; TV lounge: the caption bar, and chat shown over the picture.
tv_caption  = yellow|bgred
tv_chat     = white|bgblack
tv_chat_dim = brown|bgblack

; Screensaver profile (optional). Blank inherits avatar_chat.ini.
; Names: starfield matrix_rain life plasma aurora fireworks lightning
;   fireflies sine_wave comet_trails fire_smoke ocean_ripple lissajous
;   tunnel tv_static avatars_float figlet_message ansi_gallery
idle_random = true
idle_sequence = fire_smoke, plasma, fireworks, sine_wave
